experiment:
  name: v3_temp_mos_residual_catboost_72to24
  version: v3
  notes: V3 temperature NWP-assisted MOS residual ridge. The model learns observed
    temp minus future NWP/ERA5-style t2m, then restores absolute temperature at evaluation/inference.
    ERA5 reanalysis source is backtest-only; replace with forecast NWP for operations.
paths:
  observation_csv: data/raw/asos/asos_multistation_v2.csv
  era5_csv: data/raw/era5/asos_multistation_v2_station.csv
  station_metadata_csv: data/raw/metadata/stations_v2.csv
  output_training_table: data/processed/v3_temp_mos_residual_catboost_72to24/training_table.csv
  output_data_quality: data/processed/v3_temp_mos_residual_catboost_72to24/data_quality.json
data:
  target_name: temp
  timezone:
    source: Asia/Seoul
  observation_columns:
    station_id: station_id
    datetime: datetime
    temp: temp
    humidity: humidity
    pressure: pressure
    wind_speed: wind_speed
    precipitation: precipitation
    quality_flag: quality_flag
  era5:
    extraction_mode: bilinear
  cleaning:
    interpolate_limit_hours: 12
  features:
    encoder_continuous:
    - target_value
    - target_value_lag_1
    - target_value_lag_3
    - target_value_lag_6
    - target_value_lag_12
    - target_value_lag_24
    - target_value_lag_48
    - target_value_lag_72
    - target_value_same_hour_prev_day
    - target_value_roll_mean_3
    - target_value_roll_std_3
    - target_value_roll_mean_6
    - target_value_roll_std_6
    - target_value_roll_mean_12
    - target_value_roll_std_12
    - target_value_roll_mean_24
    - target_value_roll_std_24
    - target_value_delta_1
    - target_value_delta_6
    - target_value_delta_24
    - obs_minus_era5_temp_lag_1
    - obs_minus_era5_temp_lag_6
    - obs_minus_era5_temp_lag_24
    - obs_minus_era5_temp_lag_48
    - obs_minus_era5_temp_roll_mean_24
    - obs_minus_era5_temp_roll_mean_72
    - obs_pressure
    - obs_wind_speed
    - obs_precipitation
    - era5_t2m
    - era5_sp
    - era5_u10
    - era5_v10
    - era5_tp
    - hour_sin
    - hour_cos
    - doy_sin
    - doy_cos
    - era5_wind_speed
    - era5_wind_dir_sin
    - era5_wind_dir_cos
    - obs_minus_era5_temp_roll_std_24
    - nwp_temp_c
    - obs_minus_nwp_temp
    - obs_minus_nwp_temp_lag_1
    - obs_minus_nwp_temp_lag_3
    - obs_minus_nwp_temp_lag_6
    - obs_minus_nwp_temp_lag_12
    - obs_minus_nwp_temp_lag_24
    - obs_minus_nwp_temp_lag_48
    - obs_minus_nwp_temp_lag_72
    - obs_minus_nwp_temp_roll_mean_6
    - obs_minus_nwp_temp_roll_mean_24
    - obs_minus_nwp_temp_roll_mean_72
    - obs_minus_nwp_temp_roll_std_24
    - obs_minus_nwp_temp_delta_24
    decoder_known:
    - hour_sin
    - hour_cos
    - doy_sin
    - doy_cos
    - era5_t2m
    - era5_sp
    - era5_u10
    - era5_v10
    - era5_tp
    - era5_wind_speed
    - era5_wind_dir_sin
    - era5_wind_dir_cos
    - target_value_lag_24
    - target_value_lag_48
    - target_value_lag_72
    - target_value_same_hour_prev_day
    static_real:
    - lat
    - lon
    - elevation
    - coastal_distance_km
    static_categoricals:
    - station_id
    - region_class
    - terrain_class
    - coastal_class
  feature_engineering:
    lag_features:
      target_value:
      - 1
      - 3
      - 6
      - 12
      - 24
      - 48
      - 72
      - 168
      obs_pressure:
      - 1
      - 6
      - 24
      obs_wind_speed:
      - 1
      - 6
      - 24
      era5_t2m:
      - 1
      - 3
      - 6
      - 12
      - 24
      era5_sp:
      - 1
      - 6
      - 24
      obs_minus_era5_temp:
      - 1
      - 6
      - 24
      - 48
      obs_minus_nwp_temp:
      - 1
      - 3
      - 6
      - 12
      - 24
      - 48
      - 72
    rolling_features:
      target_value:
      - 3
      - 6
      - 12
      - 24
      obs_minus_era5_temp:
      - 24
      - 72
      obs_minus_nwp_temp:
      - 6
      - 24
      - 72
    delta_features:
      target_value:
      - 1
      - 6
      - 24
      obs_minus_nwp_temp:
      - 24
  window:
    encoder_length: 72
    prediction_length: 24
  split:
    train_end: '2024-12-31T23:00:00Z'
    val_end: '2025-01-31T23:00:00Z'
    test_end: '2025-02-28T23:00:00Z'
  scaling:
    mode: global
    group_column: station_id
    columns:
    - target_value
    - target_value_lag_1
    - target_value_lag_3
    - target_value_lag_6
    - target_value_lag_12
    - target_value_lag_24
    - target_value_lag_48
    - target_value_lag_72
    - target_value_same_hour_prev_day
    - target_value_roll_mean_3
    - target_value_roll_std_3
    - target_value_roll_mean_6
    - target_value_roll_std_6
    - target_value_roll_mean_12
    - target_value_roll_std_12
    - target_value_roll_mean_24
    - target_value_roll_std_24
    - target_value_delta_1
    - target_value_delta_6
    - target_value_delta_24
    - obs_pressure
    - obs_wind_speed
    - obs_precipitation
    - era5_t2m
    - era5_sp
    - era5_u10
    - era5_v10
    - era5_tp
    - lat
    - lon
    - elevation
    - coastal_distance_km
    - era5_wind_speed
    - era5_wind_dir_sin
    - era5_wind_dir_cos
    - obs_minus_era5_temp_lag_1
    - obs_minus_era5_temp_lag_6
    - obs_minus_era5_temp_lag_24
    - obs_minus_era5_temp_lag_48
    - obs_minus_era5_temp_roll_mean_24
    - obs_minus_era5_temp_roll_mean_72
    - obs_minus_era5_temp_roll_std_24
    - nwp_temp_c
    - obs_minus_nwp_temp
    - obs_minus_nwp_temp_lag_1
    - obs_minus_nwp_temp_lag_3
    - obs_minus_nwp_temp_lag_6
    - obs_minus_nwp_temp_lag_12
    - obs_minus_nwp_temp_lag_24
    - obs_minus_nwp_temp_lag_48
    - obs_minus_nwp_temp_lag_72
    - obs_minus_nwp_temp_roll_mean_6
    - obs_minus_nwp_temp_roll_mean_24
    - obs_minus_nwp_temp_roll_mean_72
    - obs_minus_nwp_temp_roll_std_24
    - obs_minus_nwp_temp_delta_24
  postprocess:
    clip_prediction: null
  target_transform:
    type: residual_from_feature
    baseline_column: era5_t2m_c
  future_features:
    track: nwp_assisted_mos
    source: era5_reanalysis
    operational_valid: false
    weather_columns:
    - era5_t2m
    - era5_sp
    - era5_u10
    - era5_v10
    - era5_tp
    - era5_wind_speed
    - era5_wind_dir_sin
    - era5_wind_dir_cos
    note: Backtest-only MOS upper-bound with ERA5 reanalysis; use forecast NWP source
      and --future-weather-csv for operational inference.
    leakage_risk_note: ERA5 future decoder features are reanalysis/backtest-only;
      replace with issue-time forecast NWP for operations.
model:
  name: v3_temp_mos_residual_catboost_72to24
  type: catboost
  params:
    iterations: 800
    learning_rate: 0.03
    depth: 6
    l2_leaf_reg: 3.0
    random_seed: 42
    verbose: false
    allow_writing_files: false
training:
  batch_size: 64
  max_epochs: 1
  early_stopping_patience: 1
  num_workers: 0
  device: cpu
  gradient_clip_val: 0.0
evaluation:
  bias_correction:
    enabled: true
    mode: auto
    method: auto
    candidate_modes:
    - global
    - per_horizon
    - per_station
    - per_station_horizon
    - per_season_horizon
    - per_region_horizon
    candidate_methods:
    - mean_bias
    - affine
    - quantile
    calibration_fraction: 0.7
    apply_when: improves_on_holdout
    selection_metric: rmse
    min_improvement: 0.0
artifacts:
  root_dir: data/artifacts/v3_experiments
  leaderboard_path: data/artifacts/v3_experiments/leaderboard.csv
